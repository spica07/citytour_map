<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>전국 시티투어 지도</title>
<meta name="description" content="지자체 시티투어 버스·코스 287개를 지도에서 찾아보고, 요금·운행시간을 한눈에 확인하세요">
<meta name="theme-color" content="#2F6690">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/app-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/app-icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시티투어지도">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <svg class="sign-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="11" rx="2"/>
      <path d="M3 12h18M6 5V3M18 5V3"/>
      <circle cx="7.5" cy="19" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="16.5" cy="19" r="1.6" fill="currentColor" stroke="none"/>
    </svg>
    <div class="sign-text">
      <h1 class="app-title">전국 시티투어</h1>
    </div>
    <div class="sign-count-wrap">
      <p class="sign-count"><span class="num" id="totalCount">110</span><span class="unit">곳</span></p>
      <p class="sign-sub">코스 <span class="num" id="totalCourses">287</span>개</p>
    </div>
  </div>
  <p class="app-notice">운행정보·요금은 참고용입니다. 방문 전 관리기관에 꼭 확인하세요.</p>
</header>

<main class="container">

  <!-- 필터 바 -->
  <section class="panel filter-bar">
    <div class="filter-row search-row">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="코스 이름이나 시군구로 검색해 보세요" autocomplete="off">
      </div>
      <select id="districtSelect" class="district-select" aria-label="시군구 선택">
        <option value="">전체 시·군·구</option>
      </select>
      <button class="filter-collapse-btn" id="filterToggleBtn" type="button"
              title="필터 열기" aria-label="필터 열기" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 9l7 7 7-7"/></svg>
      </button>
    </div>
    <div class="filter-groups" id="filterGroups" hidden>
      <div class="filter-row" id="sidoFilters" data-key="sido">
        <span class="filter-label">지역</span>
      </div>
      <div class="filter-row" id="methodFilters" data-key="method">
        <span class="filter-label">운행방식</span>
      </div>
      <div class="filter-row">
        <span class="filter-label">빠른필터</span>
        <button class="pill" id="freeOnlyQuick" data-toggle="freeOnly">무료 코스 있음</button>
        <button class="pill reset" id="resetBtn">초기화</button>
      </div>
    </div>
    <div class="result-count-row" id="resultCountRow">
      <div class="view-toggle" id="viewToggle">
        <button class="pill pill-sm" data-view="map">지도</button>
        <button class="pill pill-sm active" data-view="list">목록</button>
      </div>
      <button class="pill pill-sm nearby-btn" id="nearbyBtn" type="button" aria-pressed="false">
        <span id="nearbyLabel">내 주변</span>
      </button>
      <span class="result-count" id="resultCount"></span>
    </div>
    <p class="nearby-notice" id="nearbyNotice" hidden></p>
  </section>

  <!-- 지도 + 카드 목록 -->
  <section class="content-grid">
    <div class="map-pane" id="mapPane">
      <div id="map"></div>
    </div>
    <div class="list-pane" id="listPane">
      <div class="card-grid" id="cardGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <p>조건에 맞는 곳이 없어요.<br>필터를 바꿔 보세요!</p>
      </div>
    </div>
  </section>

  <footer class="app-footer">
    <p>자료: 공공데이터포털 「전국시티투어정보표준데이터」 (조회일 <span id="surveyDate"></span>) · 운행정보·요금은 바뀔 수 있으니 방문 전 관리기관에 꼭 확인하세요.</p>
  </footer>
</main>

<div class="site-notice" role="note">
  © 2026 전국 시티투어 지도 · 무단 복제를 금합니다. 본 사이트는 정보 공유 목적으로 제공됩니다. 시설명·상표 등의 권리는 해당 권리자에게 있습니다.
</div>

<!-- 상세 모달 -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="닫기">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/geo.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/share-link.js"></script>
</body>
</html>
